<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Проблемные столы — прототип отчета</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root{
      --purple-1:#6A00FF;
      --purple-2:#8A00FF;
      --purple-3:#A83CFF;
      --accent:#7A00FF;
      --bg:#f6f5f8;
      --card:#ffffff;
      --text:#1b1b1f;
      --muted:#6c6c77;
      --line:#e6e6ee;
      --shadow: 0 8px 24px rgba(19, 19, 33, 0.08);
      --radius:18px;
      --radius-sm:12px;
      --btn:#7A00FF;
      --btn-hover:#6A00FF;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:var(--bg);
    }

    /* Top header */
    .topbar{
      background: linear-gradient(90deg, var(--purple-3), var(--purple-2), var(--purple-1));
      color:#fff;
      padding: 16px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-inner{
      max-width: 1320px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .brand{
      width:44px;height:44px;
      border-radius:999px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      color: var(--purple-1);
      font-weight:900;
      letter-spacing:0.2px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.12);
      flex: 0 0 auto;
    }
    .title{
      flex: 1 1 auto;
      text-align:center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing:0.2px;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex: 0 0 auto;
    }
    .pill{
      font-size:12px;
      opacity:0.95;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,0.35);
      border-radius:999px;
      background: rgba(255,255,255,0.10);
    }
    .iconbtn{
      width:40px;height:40px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .iconbtn:hover{ background: rgba(255,255,255,0.18); }

    /* Filters row (below header) */
    .filters-wrap{
      background:#fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 76px; /* topbar height-ish */
      z-index: 40;
    }
    .filters{
      max-width:1320px;
      margin:0 auto;
      padding: 14px 18px;
      display:flex;
      gap:14px;
      align-items:flex-end;
      flex-wrap:wrap;
    }

    .field{
      min-width: 260px;
      flex: 0 0 auto;
    }
    .field label{
      display:block;
      font-size:13px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .control{
      height:56px;
      border:1px solid #d9d9e6;
      border-radius: 12px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .control:focus-within{ outline:2px solid rgba(122,0,255,0.18); border-color: rgba(122,0,255,0.35); }

    .control .value{
      font-size:18px;
      font-weight:700;
      color:#2a2a33;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 320px;
    }
    .control .hint{
      font-size:12px;
      color: var(--muted);
    }
    .control .right{
      display:flex;
      align-items:center;
      gap:10px;
      color:#2a2a33;
    }
    .mini{
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:18px;
      line-height:1;
      padding:6px 8px;
      border-radius:10px;
    }
    .mini:hover{ background:#f1eff7; }

    /* Date range inputs */
    .date-range{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .date-range input{
      height:40px;
      border:1px solid #d9d9e6;
      border-radius:10px;
      padding: 0 10px;
      font-size:14px;
      outline:none;
    }

    /* Refresh button */
    .refresh{
      height:56px;
      padding: 0 18px;
      border:0;
      border-radius: 999px;
      background: var(--btn);
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow: 0 12px 24px rgba(122,0,255,0.22);
    }
    .refresh:hover{ background: var(--btn-hover); }

    /* Main */
    .container{
      max-width: 1320px;
      margin: 18px auto 34px;
      padding: 0 18px;
    }

    /* Tabs like in screenshot */
    .tabs{
      display:flex;
      gap:26px;
      font-weight:800;
      color:#1e1e25;
      border-bottom:1px solid var(--line);
      padding: 6px 0 0;
      user-select:none;
    }
    .tab{
      padding: 14px 0;
      cursor:pointer;
      position:relative;
      color:#1e1e25;
      opacity:0.75;
    }
    .tab.active{
      opacity:1;
    }
    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:3px;
      border-radius:3px;
      background: var(--accent);
    }

    /* Cards and layout */
    .grid{
      display:grid;
      gap:14px;
      margin-top: 14px;
    }
    .grid.two{ grid-template-columns: 1fr 1fr; }
    .grid.three{ grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 1100px){
      .grid.two{ grid-template-columns: 1fr; }
      .grid.three{ grid-template-columns: 1fr; }
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 14px 10px;
    }
    .cardhead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding: 6px 6px 10px;
    }
    .cardhead h3{

      font-size:16px;
      font-weight:900;
      letter-spacing:0.1px;

    .sub{

      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }
    .badge{
      font-size:12px;
      font-weight:800;
      padding: 6px 10px;
      border-radius:999px;
      background:#f3efff;
      color: var(--accent);
      border: 1px solid rgba(122,0,255,0.18);
      white-space:nowrap;
    }

    .kpis{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
      margin-top:14px;
    }
    @media (max-width: 900px){
      .kpis{ grid-template-columns: 1fr; }
    }
    .kpi{
      background:#fff;
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .kpi .name{ color:var(--muted); font-size:12px; font-weight:800; }
    .kpi .val{ font-size:22px; font-weight:950; margin-top:6px; letter-spacing:0.2px; }
    .kpi .delta{ margin-top:6px; font-size:12px; color:var(--muted); font-weight:700; }

    canvas{ width:100% !important; height: 400px !important; }

    /* Warehouse section */
    .warehouse-section{
      margin-top: 28px;
      padding-top: 20px;
      border-top: 2px solid var(--line);
    }
    .warehouse-section:first-child{
      margin-top: 14px;
      padding-top: 0;
      border-top: none;
    }
    .warehouse-name{

      font-weight: 900;
      color: var(--accent);
      text-align: center;
      margin-bottom: 14px;
      padding: 10px;

      border-radius: 12px;

    /* Table view */
    .table-toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top: 14px;
    }
    .segmented{

      gap:8px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px;
      box-shadow: var(--shadow);

    .segbtn{
      border:0;
      background:transparent;
      padding: 10px 12px;
      border-radius:999px;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      color:#2a2a33;

    .segbtn.active{

    .search input{
      border:0;

    }

    .table-card{
      margin-top: 12px;
      padding: 0;
      overflow:hidden;
    }
    .table-wrap{
      overflow:auto;
      max-height: 620px;
    }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width: 1040px;
    }
    thead th{
      position: sticky;
      top: 0;
      z-index: 5;
      background:#fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 12px;
      text-align:left;
      font-size:13px;
      color:#2a2a33;
      font-weight:950;
      white-space:nowrap;
    }
    tbody td{
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
      font-size:14px;
      white-space:nowrap;
    }
    tbody tr:hover td{ background:#faf9ff; }
    tbody tr.total td{
      background:#ededf0;
      font-weight:950;
      border-bottom:1px solid #d8d8de;
    }
    th.sortable{ cursor:pointer; }
    th.sortable .s{
      font-size:11px;
      color: var(--muted);
      margin-left:6px;
      font-weight:900;
    }

    /* Multi-select dropdown */
    .dropdown{
      position:relative;
    }
    .menu{
      position:absolute;
      top: calc(100% + 8px);
      left:0;
      width: 420px;
      max-width: calc(100vw - 36px);
      background:#fff;
      border:1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(14,14,30,0.18);
      padding: 10px;
      display:none;
      z-index: 100;
    }
    .menu.open{ display:block; }
    .menu .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding: 6px 6px 10px;
    }
    .menu input[type="text"]{
      width:100%;
      border:1px solid #d9d9e6;
      border-radius: 12px;
      padding: 10px 10px;
      outline:none;
      font-size:14px;
    }
    .menu .list{
      max-height: 260px;
      overflow:auto;
      padding: 2px 4px;
    }
    .opt{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 9px 8px;
      border-radius: 10px;
      cursor:pointer;
    }
    .opt:hover{ background:#f7f4ff; }
    .opt input{ width:18px; height:18px; }
    .opt .lbl{ font-weight:800; font-size:14px; }
    .menu .footer{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding: 10px 6px 6px;
      border-top:1px solid var(--line);
      margin-top: 8px;
    }
    .btn-lite{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight:900;

    }
    .btn-lite:hover{ background:#faf9ff; border-color:#d7d2ee; }

    /* Small helper */
    .mono{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  </style>
</head>

<script>
/* -------------------------
   Utilities
------------------------- */
const fmt = {
  int: (n)=> new Intl.NumberFormat('ru-RU').format(Math.round(n)),
  money: (n)=> new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽',
  pct: (n)=> (Math.round(n*10)/10).toFixed(1).replace('.', ',') + '%',
  dateRU: (d)=> {
    const dd = new Date(d);
    return dd.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  }
};

function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function rand(min, max){ return Math.random()*(max-min)+min; }
function rint(min, max){ return Math.floor(rand(min, max+1)); }

function eachDay(from, to){
  const out = [];
  const d0 = new Date(from);
  const d1 = new Date(to);
  d0.setHours(0,0,0,0);
  d1.setHours(0,0,0,0);
  for (let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)){
    out.push(new Date(d));
  }
  return out;
}
function isoDate(d){
  const x = new Date(d);
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,'0');
  const dd = String(x.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

/* -------------------------
   Mock master data
------------------------- */
const WAREHOUSES = [
  "Подольск","Новосибирск","Коледино","Казань","Екатеринбург",
  "Краснодар","Электросталь","Рязань","Омск","Челябинск",
  "Воронеж","Санкт-Петербург (Шушары)","Тула","Истра","Пенза",
  "Калуга","Домодедово-2","Астрахань","Киров","Ижевск"
];

const SELLERS = Array.from({length: 55}, (_,i)=> {
  const id = 100000 + i*37 + rint(1,18);
  return { seller_id: id, seller_name: `Селлер ${id}` };
});

/* -------------------------
   State
------------------------- */
const state = {
  selectedWarehouses: new Set(WAREHOUSES), // default all
  dateFrom: null,
  dateTo: null,
  viewTab: 'charts', // charts | table
  tableView: 'warehouses', // warehouses | sellers | periods
  tableSearch: '',
  sort: { key: null, dir: 'desc' },
  // generated dataset
  data: null,
  charts: {}
};

/* -------------------------
   Generate mock data by day/warehouse/seller
   (covers your metrics, excluding yellow ones)
------------------------- */
function generateData(from, to){
  const days = eachDay(from, to);

  // Per day per warehouse aggregated operational data
  // We'll model:
  // - inbound_to_problem (шт)
  // - processed_success (шт)
  // - processed_fail (шт)
  // - confirmed_problems (шт)
  // - barcode_issue_share (%) (north star proxy on inbound)
  // - savings (₽) (seller savings)
  const byDay = [];

  for (const day of days){
    const date = isoDate(day);

    const whRows = WAREHOUSES.map((wh, idx) => {
      // baseline varies by warehouse
      const base = 250 + idx*22 + rint(-40, 60);

      const inbound = clamp(Math.round(base * rand(0.75, 1.25)), 20, 2200);
      
      // Общая доля обезлички: 15..35%
      const totalAnonymousShare = clamp(rand(15, 35) + Math.sin((day.getTime()/8.64e7)/6)*3, 12, 40);
      
      // Доля обезлички по причине баркода (сумма 3 причин) — часть от общей
      const barcodeShare = clamp(totalAnonymousShare * rand(0.5, 0.75), 6, 30);
      
      // Разбивка по причинам баркода:
      const noBarcode = clamp(barcodeShare * rand(0.3, 0.45), 2, 15);        // нет баркода на вещи
      const notScanning = clamp(barcodeShare * rand(0.25, 0.4), 1, 12);      // не сканируется баркод  
      const notInDb = clamp(barcodeShare - noBarcode - notScanning, 1, 10);  // нет баркода в базе

      // success rate 68..92
      const successRate = clamp(rand(68, 92) - (barcodeShare-18)*0.25, 55, 95);
      const success = Math.round(inbound * (successRate/100));
      const fail = Math.max(0, inbound - success);

      // confirmed problems as subset of inbound 10..30%
      const confirmed = Math.round(inbound * clamp(rand(0.10, 0.30) + (barcodeShare/100)*0.05, 0.08, 0.38));

      // savings: depends on successful items (assume avg 120₽ savings per item for seller, but with noise)
      const savings = Math.round(success * rand(80, 140));

      return {
        date, warehouse: wh,
        inbound_to_problem: inbound,
        total_anonymous_share: totalAnonymousShare,
        barcode_issue_share: barcodeShare,
        no_barcode_share: noBarcode,
        not_scanning_share: notScanning,
        not_in_db_share: notInDb,
        processed_success: success,
        processed_fail: fail,
        confirmed_problems: confirmed,
        savings_rub: savings
      };
    });

    byDay.push({ date, warehouses: whRows });
  }

  // Seller side metrics (adoption/churn/value)
  // We'll create seller status within the period
  const sellerRows = SELLERS.map(s => {
    const adoptionProb = rand(0.18, 0.55); // % of period where "adopted"
    const adopted = Math.random() < adoptionProb;

    // if adopted, pick adoption date within period
    const startIdx = adopted ? rint(0, days.length-1) : null;
    const adoptedAt = adopted ? isoDate(days[startIdx]) : null;

    // churn behaviors
    const churn2w = adopted ? (Math.random() < rand(0.10, 0.28)) : false;
    // overall churn with time
    const churn = adopted ? (Math.random() < rand(0.18, 0.40)) : false;

    let offAt = null;
    let lifetimeDays = 0;
    if (adopted && churn){
      // churn date after 7..(len) days
      const offIdx = clamp(startIdx + rint(7, Math.max(7, Math.floor(days.length*0.8))), startIdx, days.length-1);
      offAt = isoDate(days[offIdx]);
      lifetimeDays = offIdx - startIdx;
    } else if (adopted){
      lifetimeDays = days.length - 1 - startIdx;
    }

    // items sent through service, depends on lifetime
    const items = adopted ? Math.round(rand(1.5, 9.5) * Math.max(1, lifetimeDays/7 + 0.8)) : 0;
    const savings = adopted ? Math.round(items * rand(70, 150)) : 0;

    return {
      seller_id: s.seller_id,
      seller_name: s.seller_name,
      adopted,
      adopted_at: adoptedAt,
      churned: adopted ? churn : false,
      churned_at: offAt,
      churn_2w: adopted ? churn2w : false,
      lifetime_days: lifetimeDays,
      items_through_problem_table: items,
      savings_rub: savings
    };
  });

  // Economic: "extra revenue" proxy
  // We'll make it correlated to processed_success (service fee margin etc.)
  // Note: user metric list had 12-month scenario numbers, but here we'll do per period mock with scenario lines.
  // We'll generate a daily "fact revenue" as function of processed_success across selected warehouses later.
  return { days: days.map(d=>isoDate(d)), byDay, sellers: sellerRows };
}

/* -------------------------
   Compute aggregates given selected warehouses + date range
------------------------- */
function computeAggregates(data, selectedWarehouses){
  const sel = new Set(selectedWarehouses);
  const days = data.days;

  const series = {
    labels: days,
    northStarPct: [],  // % обезлички на проблемные столы
    inbound: [],       // кол-во товаров на проблемный стол
    success: [],
    successPct: []     // % успешно обработано
  };

  // Build daily aggregates
  for (const dayBlock of data.byDay){
    const rows = dayBlock.warehouses.filter(r => sel.has(r.warehouse));

    const inbound = rows.reduce((a,r)=>a+r.inbound_to_problem,0);
    const success = rows.reduce((a,r)=>a+r.processed_success,0);

    // North Star: % обезлички на проблемные столы (weighted by inbound)
    const northStar = inbound
      ? rows.reduce((a,r)=>a + r.barcode_issue_share * r.inbound_to_problem, 0) / inbound
      : 0;

    series.northStarPct.push(northStar);
    series.inbound.push(inbound);
    series.success.push(success);
    series.successPct.push(inbound ? (success / inbound * 100) : 0);
  }

  // KPIs period-level
  const totalInbound = series.inbound.reduce((a,b)=>a+b,0);
  const totalSuccess = series.success.reduce((a,b)=>a+b,0);

  const avgNorth = series.northStarPct.length
    ? series.northStarPct.reduce((a,b)=>a+b,0) / series.northStarPct.length
    : 0;

  const successRate = totalInbound ? (totalSuccess / totalInbound * 100) : 0;

  const kpis = {
    avgNorth,
    totalInbound,
    successRate
  };

  return { series, kpis };
}

   Table
------------------------- */
function makeColumns(view){
  if (view === 'warehouses'){
    return [
      { key:'warehouse', label:'Склад', type:'text' },
      { key:'north_star_pct', label:'% обезлички на пробл. стол', type:'pct' },
      { key:'inbound', label:'Товаров на пробл. стол, шт', type:'int' },
      { key:'success_pct', label:'% успешно обработано', type:'pct' }
    ];
  }

  // sellers
  return [
    { key:'seller_id', label:'ID', type:'int' },
    { key:'seller_name', label:'Селлер', type:'text' },
    { key:'items', label:'Товаров через стол, шт', type:'int' },
    { key:'success_pct', label:'% успешно обработано', type:'pct' }
  ];
}

function formatCell(type, v){
  if (type==='int') return fmt.int(v);
  if (type==='money') return fmt.money(v);
  if (type==='pct') return fmt.pct(v);
  if (type==='bool') return v ? 'Да' : 'Нет';
  return (v ?? '—');
}

function getTableRows(){
  const data = state.data;
  const sel = state.selectedWarehouses;

  const byWh = new Map();

  // warehouse-level aggregation
  for (const dayBlock of data.byDay){
    const rows = dayBlock.warehouses.filter(r => sel.has(r.warehouse));
    
    for (const r of rows){
      if (!byWh.has(r.warehouse)){
        byWh.set(r.warehouse, {
          warehouse: r.warehouse,
          inbound: 0,
          success: 0,
          _barcode_weight: 0
        });
      }
      const o = byWh.get(r.warehouse);
      o.inbound += r.inbound_to_problem;
      o.success += r.processed_success;
      o._barcode_weight += r.barcode_issue_share * r.inbound_to_problem;
    }
  }

  // finalize warehouse rows
  const whRows = Array.from(byWh.values()).map(o => ({
    warehouse: o.warehouse,
    north_star_pct: o.inbound ? (o._barcode_weight / o.inbound) : 0,
    inbound: o.inbound,
    success_pct: o.inbound ? (o.success / o.inbound * 100) : 0
  }));

  const totalInbound = whRows.reduce((a,r)=>a+r.inbound,0);
  const totalSuccess = whRows.reduce((a,r)=>a+r.inbound * r.success_pct / 100, 0);
  const totalNorthWeight = whRows.reduce((a,r)=>a+r.north_star_pct * r.inbound, 0);

  // seller rows
  const sellerRows = data.sellers.map(s => {
    const items = s.items_through_problem_table;
    const successRate = rand(65, 95); // мок-данные для % успеха
    return {
      seller_id: s.seller_id,
      seller_name: s.seller_name,
      items: items,
      success_pct: items > 0 ? successRate : 0
    };
  });

  const totalSellerItems = sellerRows.reduce((a,r)=>a+r.items,0);
  const avgSellerSuccess = sellerRows.length 
    ? sellerRows.reduce((a,r)=>a+r.success_pct,0) / sellerRows.length 
    : 0;

  // totals row per view
  const totals = {
    warehouses: {
      warehouse: 'Итого',
      north_star_pct: totalInbound ? (totalNorthWeight / totalInbound) : 0,
      inbound: totalInbound,
      success_pct: totalInbound ? (totalSuccess / totalInbound * 100) : 0
    },
    sellers: {
      seller_id: '—',
      seller_name: 'Итого',
      items: totalSellerItems,
      success_pct: avgSellerSuccess
    }
  };

  return { whRows, sellerRows, totals };
}

function applySearch(rows, cols, q){
  if (!q) return rows;
  const s = q.toLowerCase().trim();
  return rows.filter(r => cols.some(c => String(r[c.key] ?? '').toLowerCase().includes(s)));
}

function sortRows(rows, key, dir){
  if (!key) return rows;
  const sign = dir === 'asc' ? 1 : -1;
  const copy = [...rows];
  copy.sort((a,b)=>{
    const va = a[key], vb = b[key];
    // numbers first
    const na = (typeof va === 'number') ? va : (va && !isNaN(Number(va)) ? Number(va) : null);
    const nb = (typeof vb === 'number') ? vb : (vb && !isNaN(Number(vb)) ? Number(vb) : null);
    if (na !== null && nb !== null) return (na-nb)*sign;
    return String(va ?? '').localeCompare(String(vb ?? ''), 'ru') * sign;
  });
  return copy;
}

function renderTable(){
  const cols = makeColumns(state.tableView);
  const { whRows, sellerRows, totals } = getTableRows();

  let rows = state.tableView === 'warehouses' ? whRows : sellerRows;

  // search
  rows = applySearch(rows, cols, state.tableSearch);

  // sort (totals row should stay top)
  rows = sortRows(rows, state.sort.key, state.sort.dir);

  // header
  const thead = document.getElementById('thead');
  thead.innerHTML = `
    <tr>
      ${cols.map(c => {
        const is = c.key === state.sort.key;
        const arrow = is ? (state.sort.dir==='asc' ? '▲' : '▼') : '↕';
        return `<th class="sortable" data-key="${c.key}">
          ${c.label}<span class="s">${arrow}</span>
        </th>`;
      }).join('')}
    </tr>
  `;

  // body
  const tbody = document.getElementById('tbody');
  const total = totals[state.tableView];

  const totalRowHtml = `
    <tr class="total">
      ${cols.map(c => `<td class="mono">${formatCell(c.type, total[c.key])}</td>`).join('')}
    </tr>
  `;

  const rowsHtml = rows.map(r => `
    <tr>
      ${cols.map(c => `<td class="mono">${formatCell(c.type, r[c.key])}</td>`).join('')}
    </tr>
  `).join('');

  tbody.innerHTML = totalRowHtml + rowsHtml;

  // attach sort handlers
  thead.querySelectorAll('th.sortable').forEach(th => {
    th.onclick = () => {
      const key = th.getAttribute('data-key');
      if (state.sort.key === key){
        state.sort.dir = (state.sort.dir === 'asc') ? 'desc' : 'asc';
      } else {
        state.sort.key = key;
        state.sort.dir = 'desc';
      }
      renderTable();
    };
  });
}

function renderWarehouseMenu(){
  const list = document.getElementById('whList');
  const q = document.getElementById('whSearch').value.toLowerCase().trim();
  list.innerHTML = '';

  const filtered = WAREHOUSES.filter(w => w.toLowerCase().includes(q));
  for (const w of filtered){
    const checked = state.selectedWarehouses.has(w);
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `
      <input type="checkbox" ${checked ? 'checked' : ''} />
      <div class="lbl">${w}</div>
    `;
    div.onclick = (e) => {
      const cb = div.querySelector('input');
      cb.checked = !cb.checked;
      if (cb.checked) state.selectedWarehouses.add(w);
      else state.selectedWarehouses.delete(w);
      updateWarehouseControl();
      e.stopPropagation();
    };
    list.appendChild(div);
  }
}

function updateWarehouseControl(){
  const count = state.selectedWarehouses.size;
  document.getElementById('whCount').textContent = String(count);

  const all = count === WAREHOUSES.length;
  const none = count === 0;

  const text = all ? 'Выбраны все' : (none ? 'Не выбрано' : `Выбрано: ${count}`);
  document.getElementById('whValue').textContent = text;

  const hint = all ? 'Мультивыбор' : (none ? 'Нужно выбрать хотя бы 1 склад' : 'Мультивыбор');
  document.getElementById('whHint').textContent = hint;
}

function refreshAll({regen=false}={}){
  // Validate
  if (!state.dateFrom || !state.dateTo){
    alert('Выберите период (дата с / дата по).');
    return;
  }
  if (state.selectedWarehouses.size === 0){
    alert('Выберите хотя бы один склад.');
    return;
  }

  if (regen || !state.data){
    state.data = generateData(state.dateFrom, state.dateTo);
  }

  const { series, kpis } = computeAggregates(state.data, state.selectedWarehouses);
  renderKPIs(kpis);
  renderCharts();

  // table depends on state; render if visible or keep ready
  if (state.viewTab === 'table') renderTable();
}

  document.getElementById('chartsView').style.display = tab==='charts' ? '' : 'none';
  document.getElementById('tableView').style.display = tab==='table' ? '' : 'none';
  if (tab==='table') renderTable();
}

/* -------------------------
   Init
------------------------- */
(function init(){
  // default period = last 8 days (like your screenshot vibe)
  const today = new Date();
  const to = new Date(today); to.setDate(to.getDate());
  const from = new Date(today); from.setDate(from.getDate()-7);

  state.dateFrom = isoDate(from);
  state.dateTo = isoDate(to);

  const df = document.getElementById('dateFrom');
  const dt = document.getElementById('dateTo');
  df.value = state.dateFrom;
  dt.value = state.dateTo;
  updatePeriodText();

  df.onchange = () => {
    state.dateFrom = df.value;
    if (state.dateTo && state.dateFrom > state.dateTo){
      state.dateTo = state.dateFrom;
      dt.value = state.dateTo;
    }
    updatePeriodText();
  };
  dt.onchange = () => {
    state.dateTo = dt.value;
    if (state.dateFrom && state.dateFrom > state.dateTo){
      state.dateFrom = state.dateTo;
      df.value = state.dateFrom;
    }
    updatePeriodText();
  };

  // Warehouse dropdown behaviors
  updateWarehouseControl();
  renderWarehouseMenu();

  const menu = document.getElementById('whMenu');
  const openMenu = () => {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden','false');
    renderWarehouseMenu();
    document.getElementById('whSearch').focus();
  };
  const closeMenu = () => {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden','true');
  };

  document.getElementById('whOpen').onclick = (e)=>{ e.stopPropagation(); menu.classList.contains('open') ? closeMenu() : openMenu(); };
  document.getElementById('whControl').onclick = (e)=>{ e.stopPropagation(); menu.classList.contains('open') ? closeMenu() : openMenu(); };
  document.getElementById('whSearch').oninput = ()=> renderWarehouseMenu();

  document.getElementById('whSelectAll').onclick = ()=>{
    state.selectedWarehouses = new Set(WAREHOUSES);
    updateWarehouseControl();
    renderWarehouseMenu();
  };
  document.getElementById('whClear').onclick = (e)=>{
    e.stopPropagation();
    state.selectedWarehouses = new Set(WAREHOUSES); // “×” трактуем как reset
    updateWarehouseControl();
    renderWarehouseMenu();
  };
  document.getElementById('whApply').onclick = ()=> closeMenu();

  // Close dropdown on outside click
  document.addEventListener('click', (e)=>{
    if (!document.getElementById('whDropdown').contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape') closeMenu();
  });

  // Tabs
  document.getElementById('tabCharts').onclick = ()=> setMainTab('charts');
  document.getElementById('tabTable').onclick = ()=> setMainTab('table');

  // Table segmented
  document.querySelectorAll('.segbtn').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.segbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.tableView = b.getAttribute('data-view');
      state.sort = { key: null, dir:'desc' };
      renderTable();
    };
  });

  // Table search
  const ts = document.getElementById('tableSearch');
  ts.oninput = ()=>{
    state.tableSearch = ts.value;
    renderTable();
  };

  // Refresh button = regenerate mock data (to simulate “обновить”)
  document.getElementById('refreshBtn').onclick = ()=>{
    refreshAll({ regen:true });
  };

  // First render
  refreshAll({ regen:true });
})();
</script>
</body>
</html>
